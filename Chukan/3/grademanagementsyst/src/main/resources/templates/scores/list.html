<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>成績管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h1>成績管理</h1>

    <!-- 検索フォーム -->
    <div class="content-card">

        <h2>成績検索</h2>

        <form th:action="@{/scores}" method="get" class="search-form">

            <div class="search-group">
                <label for="studentId">学生</label>

                <select id="studentId" name="studentId">

                    <option value=""
                            th:selected="${selectedStudentId == null}">
                        すべて
                    </option>

                    <option th:each="student : ${students}"
                            th:value="${student.id}"
                            th:text="${student.name}"
                            th:selected="${selectedStudentId != null and selectedStudentId == student.id}">
                    </option>

                </select>
            </div>

            <div class="search-group">
                <label for="subjectId">科目</label>

                <select id="subjectId" name="subjectId">

                    <option value=""
                            th:selected="${selectedSubjectId == null}">
                        すべて
                    </option>

                    <option th:each="subject : ${subjects}"
                            th:value="${subject.id}"
                            th:text="${subject.subjectName}"
                            th:selected="${selectedSubjectId != null and selectedSubjectId == subject.id}">
                    </option>

                </select>
            </div>

            <div>
                <button type="submit" class="button">
                    検索
                </button>

                <a th:href="@{/scores}" class="button button-secondary">
                    クリア
                </a>
                
                <a th:href="@{/scores/new}" class="button">
                    成績登録
                </a>
            </div>

        </form>

    </div>

    <!-- 成績一覧 -->
    <div class="content-card">

        <table class="data-table">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>学生</th>
                    <th>科目</th>
                    <th>点数</th>
                    <th>評価</th>
                    <th>試験日</th>
                    <th>編集</th>
                    <th>削除</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="score : ${scores}">

                    <td th:text="${score.id}">
                    </td>

                    <!-- 学生名 -->
                    <td>
                        <span th:each="student : ${students}"
                              th:if="${student.id == score.studentId}"
                              th:text="${student.name}">
                            学生名
                        </span>
                    </td>

                    <!-- 科目名 -->
                    <td>
                        <span th:each="subject : ${subjects}"
                              th:if="${subject.id == score.subjectId}"
                              th:text="${subject.subjectName}">
                            科目名
                        </span>
                    </td>

                    <td th:text="${score.score}">
                    </td>

                    <td th:text="${score.grade}">
                    </td>

                    <td th:text="${score.examDate}">
                    </td>

                    <td>
                        <a th:href="@{/scores/edit/{id}(id=${score.id})}"
                           class="button">
                            編集
                        </a>
                    </td>

                    <td>
                        <a th:href="@{/scores/delete/{id}(id=${score.id})}"
                           class="button button-danger"
                           onclick="return confirm('この成績を削除しますか？');">
                            削除
                        </a>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <a th:href="@{/}" class="back-link">
        メニューに戻る
    </a>

</body>
</html>
