<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${score.id == null ? '成績登録' : '成績編集'}">
        成績登録
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h1 th:text="${score.id == null ? '成績登録' : '成績編集'}">
        成績登録
    </h1>

    <div class="form-card">

        <form th:object="${score}"
              th:action="${score.id == null ? '/scores' : '/scores/update'}"
              method="post">

            <!-- 学生 -->
            <div class="form-group">

                <label for="studentId">
                    学生
                </label>

                <select id="studentId"
                        th:field="*{studentId}">

                    <option value="">
                        選択してください
                    </option>

                    <option th:each="student : ${students}"
                            th:value="${student.id}"
                            th:text="${student.studentNumber + '：' + student.name}">
                    </option>

                </select>

                <div class="error-message"
                     th:if="${#fields.hasErrors('studentId')}"
                     th:errors="*{studentId}">
                </div>

            </div>

            <!-- 科目 -->
            <div class="form-group">

                <label for="subjectId">
                    科目
                </label>

                <select id="subjectId"
                        th:field="*{subjectId}">

                    <option value="">
                        選択してください
                    </option>

                    <option th:each="subject : ${subjects}"
                            th:value="${subject.id}"
                            th:text="${subject.subjectCode + '：' + subject.subjectName}">
                    </option>

                </select>

                <div class="error-message"
                     th:if="${#fields.hasErrors('subjectId')}"
                     th:errors="*{subjectId}">
                </div>

            </div>

            <!-- 点数 -->
            <div class="form-group">

                <label for="score">
                    点数
                </label>

                <input type="number"
                       id="score"
                       th:field="*{score}"
                       min="0"
                       max="100">

                <div class="error-message"
                     th:if="${#fields.hasErrors('score')}"
                     th:errors="*{score}">
                </div>

            </div>

            <!-- 試験日 -->
            <div class="form-group">

                <label for="examDate">
                    試験日
                </label>

                <input type="date"
                       id="examDate"
                       th:field="*{examDate}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('examDate')}"
                     th:errors="*{examDate}">
                </div>

            </div>

            <!-- ボタン -->
            <div class="form-actions">

                <button type="submit"
                        class="button"
                        th:text="${score.id == null ? '登録する' : '更新する'}">
                    登録する
                </button>

                <a th:href="@{/scores}"
                   class="button button-secondary">
                    キャンセル
                </a>

            </div>

        </form>

    </div>

    <a th:href="@{/scores}"
       class="back-link">
        成績一覧に戻る
    </a>

</body>
</html>
