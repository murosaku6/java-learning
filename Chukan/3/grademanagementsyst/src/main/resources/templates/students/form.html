<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${student.id == null ? '学生登録' : '学生編集'}">
        学生登録
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h1 th:text="${student.id == null ? '学生登録' : '学生編集'}">
        学生登録
    </h1>

    <div class="form-card">

        <form th:object="${student}"
              th:action="${student.id == null ? '/students' : '/students/update'}"
              method="post">

            <!-- 学籍番号 -->
            <div class="form-group">

                <label for="studentNumber">
                    学籍番号
                </label>

                <input type="text"
                       id="studentNumber"
                       th:field="*{studentNumber}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('studentNumber')}"
                     th:errors="*{studentNumber}">
                </div>

            </div>

            <!-- 氏名 -->
            <div class="form-group">

                <label for="name">
                    氏名
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">
                </div>

            </div>

            <!-- 学年 -->
            <div class="form-group">

                <label for="grade">
                    学年
                </label>

                <input type="number"
                       id="grade"
                       th:field="*{grade}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('grade')}"
                     th:errors="*{grade}">
                </div>

            </div>

            <!-- クラス -->
            <div class="form-group">

                <label for="className">
                    クラス
                </label>

                <input type="text"
                       id="className"
                       th:field="*{className}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('className')}"
                     th:errors="*{className}">
                </div>

            </div>

            <!-- ボタン -->
            <div class="form-actions">

                <button type="submit" class="button"
                        th:text="${student.id == null ? '登録する' : '更新する'}">
                    登録する
                </button>

                <a th:href="@{/students}" class="button button-secondary">
                    キャンセル
                </a>

            </div>

        </form>

    </div>

    <a th:href="@{/students}" class="back-link">
        学生一覧に戻る
    </a>

</body>
</html>
