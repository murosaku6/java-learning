<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${subject.id == null ? '科目登録' : '科目編集'}">
        科目登録
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h1 th:text="${subject.id == null ? '科目登録' : '科目編集'}">
        科目登録
    </h1>

    <div class="form-card">

        <form th:object="${subject}"
              th:action="${subject.id == null ? '/subjects' : '/subjects/update'}"
              method="post">

            <!-- 科目コード -->
            <div class="form-group">

                <label for="subjectCode">
                    科目コード
                </label>

                <input type="text"
                       id="subjectCode"
                       th:field="*{subjectCode}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('subjectCode')}"
                     th:errors="*{subjectCode}">
                </div>

            </div>

            <!-- 科目名 -->
            <div class="form-group">

                <label for="subjectName">
                    科目名
                </label>

                <input type="text"
                       id="subjectName"
                       th:field="*{subjectName}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('subjectName')}"
                     th:errors="*{subjectName}">
                </div>

            </div>

            <!-- 単位数 -->
            <div class="form-group">

                <label for="credits">
                    単位数
                </label>

                <input type="number"
                       id="credits"
                       th:field="*{credits}">

                <div class="error-message"
                     th:if="${#fields.hasErrors('credits')}"
                     th:errors="*{credits}">
                </div>

            </div>

            <!-- ボタン -->
            <div class="form-actions">

                <button type="submit"
                        class="button"
                        th:text="${subject.id == null ? '登録する' : '更新する'}">
                    登録する
                </button>

                <a th:href="@{/subjects}"
                   class="button button-secondary">
                    キャンセル
                </a>

            </div>

        </form>

    </div>

    <a th:href="@{/subjects}"
       class="back-link">
        科目一覧に戻る
    </a>

</body>
</html>
