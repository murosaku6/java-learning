<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成績統計</title>
    <style>

        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 30px;
        }

        .statistics-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 180px;
            text-align: center;
        }

        .stat-title {
            font-size: 16px;
            color: #666;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            background-color: white;
            margin-bottom: 30px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eeeeee;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #555;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <h1>成績統計</h1>

    <!-- 全体統計 -->
    <h2>全体統計</h2>

    <div class="statistics-container">

        <div class="stat-card">
            <div class="stat-title">
                平均点
            </div>

            <div class="stat-value">
                <span th:text="${#numbers.formatDecimal(averageScore, 1, 1)}">
                    0.0
                </span>
                点
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-title">
                最高点
            </div>

            <div class="stat-value">
                <span th:text="${maxScore}">
                    0
                </span>
                点
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-title">
                最低点
            </div>

            <div class="stat-value">
                <span th:text="${minScore}">
                    0
                </span>
                点
            </div>
        </div>
    </div>


    <!-- 学生別平均 -->
    <h2>学生別平均点</h2>

    <table>

        <thead>
            <tr>
                <th>学生名</th>
                <th>平均点</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="entry : ${averageScoreByStudent}">

                <td>

                    <span th:each="student : ${students}"
                        th:if="${student.id == entry.key}"
                        th:text="${student.name}">
                        学生名
                    </span>

                </td>

                <td>
                    <span th:text="${#numbers.formatDecimal(entry.value, 1, 1)}">
                        0.0
                    </span>
                    点
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 学生ランキング -->
    <h2>学生ランキング</h2>
    <table>
        <thead>
            <tr>
                <th>順位</th>
                <th>学生名</th>
                <th>平均点</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="entry, status : ${studentRanking}">
                <td th:text="${status.count}">
                    1
                </td>

                <td>
                    <span th:each="student : ${students}"
                        th:if="${student.id == entry.key}"
                        th:text="${student.name}">
                        学生名
                    </span>
                </td>

                <td>
                    <span th:text="${#numbers.formatDecimal(entry.value, 1, 1)}">
                        0.0
                    </span>
                    点
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 科目別平均 -->
    <h2>科目別平均点</h2>

    <table>

        <thead>
            <tr>
                <th>科目名</th>
                <th>平均点</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="entry : ${averageScoreBySubject}">

                <td>

                    <span th:each="subject : ${subjects}"
                        th:if="${subject.id == entry.key}"
                        th:text="${subject.subjectName}">
                        科目名
                    </span>

                </td>

                <td>
                    <span th:text="${#numbers.formatDecimal(entry.value, 1, 1)}">
                        0.0
                    </span>
                    点
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 戻る -->
    <a href="/" class="back-button">
        トップへ戻る
    </a>
</body>
</html>
