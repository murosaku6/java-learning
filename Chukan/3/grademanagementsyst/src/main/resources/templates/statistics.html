<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>成績統計</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h1>成績統計</h1>

    <!-- 全体統計 -->
    <div class="content-card">

        <h2>全体統計</h2>

        <div class="statistics-container">

            <div class="stat-card">

                <h2>平均点</h2>

                <p>
                    <span th:text="${#numbers.formatDecimal(averageScore, 1, 1)}">
                        0.0
                    </span>
                    点
                </p>

            </div>

            <div class="stat-card">

                <h2>最高点</h2>

                <p>
                    <span th:text="${maxScore}">
                        0
                    </span>
                    点
                </p>

            </div>

            <div class="stat-card">

                <h2>最低点</h2>

                <p>
                    <span th:text="${minScore}">
                        0
                    </span>
                    点
                </p>

            </div>

        </div>

    </div>


    <!-- 学生別平均 -->
    <div class="content-card">

        <h2>学生別平均点</h2>

        <table class="data-table">

            <thead>
                <tr>
                    <th>学生名</th>
                    <th>平均点</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="entry : ${averageScoreByStudent}">

                    <td>

                        <span th:each="student : ${students}"
                              th:if="${student.id == entry.key}"
                              th:text="${student.name}">
                            学生名
                        </span>

                    </td>

                    <td>

                        <span th:text="${#numbers.formatDecimal(entry.value, 1, 1)}">
                            0.0
                        </span>
                        点

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- 学生ランキング -->
    <div class="content-card">

        <h2>学生ランキング</h2>

        <table class="data-table">

            <thead>
                <tr>
                    <th>順位</th>
                    <th>学生名</th>
                    <th>平均点</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="entry, status : ${studentRanking}">

                    <td th:text="${status.count}">
                        1
                    </td>

                    <td>

                        <span th:each="student : ${students}"
                              th:if="${student.id == entry.key}"
                              th:text="${student.name}">
                            学生名
                        </span>

                    </td>

                    <td>

                        <span th:text="${#numbers.formatDecimal(entry.value, 1, 1)}">
                            0.0
                        </span>
                        点

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- 科目別平均 -->
    <div class="content-card">

        <h2>科目別平均点</h2>

        <table class="data-table">

            <thead>
                <tr>
                    <th>科目名</th>
                    <th>平均点</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="entry : ${averageScoreBySubject}">

                    <td>

                        <span th:each="subject : ${subjects}"
                              th:if="${subject.id == entry.key}"
                              th:text="${subject.subjectName}">
                            科目名
                        </span>

                    </td>

                    <td>

                        <span th:text="${#numbers.formatDecimal(entry.value, 1, 1)}">
                            0.0
                        </span>
                        点

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- 戻る -->
    <a th:href="@{/}"
       class="back-link">
        メニューに戻る
    </a>

</body>
</html>
